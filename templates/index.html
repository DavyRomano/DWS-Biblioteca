<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
    <header>
        <h1>Biblioteca</h1>
        <p>Cadastro e consulta de livros</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Cadastrar livro</h2>
            <form id="form-livro">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" required maxlength="150">

                <label for="autor">Autor</label>
                <input type="text" id="autor" required maxlength="120">

                <label for="ano">Ano de publicação</label>
                <input type="number" id="ano" min="0" max="2100" required>

                <button type="submit" id="botao-cadastrar">Cadastrar</button>
            </form>
            <p id="mensagem"></p>
        </section>

        <section class="acervo">
            <div class="titulo-acervo">
                <h2>Livros cadastrados</h2>
                <button type="button" id="botao-atualizar">Atualizar</button>
            </div>
            <p>Quantidade: <span id="contador">0</span></p>
            <p id="estado-vazio">Nenhum livro cadastrado.</p>
            <div id="lista-livros"></div>
        </section>
    </main>
</body>
</html>
